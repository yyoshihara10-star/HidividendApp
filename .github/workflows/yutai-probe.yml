name: Yutai Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install curl_cffi requests beautifulsoup4
      - name: Probe
        run: |
          cat > probe.py <<'PYEOF'
          import time
          from curl_cffi import requests as creq
          import requests as preq
          import urllib.request

          KABU = "https://kabutan.jp/stock/yutai?code=2768"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "ja,en-US;q=0.9",
              "Referer": "https://kabutan.jp/stock/?code=2768",
          }

          def show(label, fn):
              try:
                  r = fn()
                  body = r.text if hasattr(r, "text") else r
                  has_yutai = "優待" in body
                  has_month = "権利確定月" in body
                  print(f"[PROBE] {label}: status={getattr(r, 'status_code', '?')} len={len(body)} yutai_word={has_yutai} month_marker={has_month}", flush=True)
              except Exception as e:
                  print(f"[PROBE] {label}: EXC {str(e)[:120]}", flush=True)
              time.sleep(1)

          show("curl_cffi chrome (current)", lambda: creq.get(KABU, impersonate="chrome", timeout=20))
          show("curl_cffi chrome + headers", lambda: creq.get(KABU, impersonate="chrome", headers=HEADERS, timeout=20))
          show("curl_cffi no impersonate", lambda: creq.get(KABU, headers=HEADERS, timeout=20))
          show("curl_cffi safari_ios", lambda: creq.get(KABU, impersonate="safari_ios", timeout=20))
          show("plain requests + headers", lambda: preq.get(KABU, headers=HEADERS, timeout=20))
          show("urllib + UA", lambda: urllib.request.urlopen(urllib.request.Request(KABU, headers={"User-Agent": HEADERS["User-Agent"]}), timeout=20).read().decode("utf-8", "ignore"))
          show("kabutan top page (control)", lambda: creq.get("https://kabutan.jp/", impersonate="chrome", timeout=20))
          show("kabutan stock page", lambda: creq.get("https://kabutan.jp/stock/?code=2768", impersonate="chrome", headers=HEADERS, timeout=20))
          show("yahoo finance yutai", lambda: creq.get("https://finance.yahoo.co.jp/quote/2768.T/yutai", impersonate="chrome", headers=HEADERS, timeout=20))
          show("nikkei yutai", lambda: creq.get("https://www.nikkei.com/nkd/company/yutai/?scode=2768", impersonate="chrome", headers=HEADERS, timeout=20))
          show("buffett code", lambda: creq.get("https://www.buffett-code.com/company/2768/", impersonate="chrome", headers=HEADERS, timeout=20))
          print("[PROBE] done", flush=True)
          PYEOF
          python probe.py
